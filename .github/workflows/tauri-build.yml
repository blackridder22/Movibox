name: MoviBox installers

on:
  workflow_dispatch:
    inputs:
      signed:
        description: "Sign updater artifacts; notarize macOS (requires release credentials)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-aarch64
            runner: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - platform: darwin-x86_64
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - platform: windows-x86_64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - platform: linux-x86_64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb,appimage
    env:
      npm_config_manage_package_manager_versions: "false"
      MOVIBOX_UPDATE_ENDPOINT: ${{ inputs.signed && vars.MOVIBOX_UPDATE_ENDPOINT || '' }}
      MOVIBOX_UPDATE_PUBLIC_KEY: ${{ inputs.signed && vars.MOVIBOX_UPDATE_PUBLIC_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.signed && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.signed && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
      APPLE_SIGNING_IDENTITY: ${{ inputs.signed && secrets.APPLE_SIGNING_IDENTITY || '' }}
      APPLE_ID: ${{ inputs.signed && secrets.APPLE_ID || '' }}
      APPLE_PASSWORD: ${{ inputs.signed && secrets.APPLE_PASSWORD || '' }}
      APPLE_TEAM_ID: ${{ inputs.signed && secrets.APPLE_TEAM_ID || '' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: pnpm/action-setup@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev libgtk-3-dev patchelf
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup:fonts
      - run: pnpm run typecheck
      - run: pnpm test
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --lib
      - name: Release preflight
        shell: bash
        run: node scripts/release.mjs config ${{ inputs.signed && 'signed' || 'local' }}
      - name: Build local installers
        if: ${{ !inputs.signed }}
        shell: bash
        run: |
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          unset TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          pnpm tauri build --ci --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.generated.json
      - name: Build signed installers
        if: inputs.signed
        uses: tauri-apps/tauri-action@v0
        env:
          APPLE_CERTIFICATE: ${{ inputs.signed && secrets.APPLE_CERTIFICATE || '' }}
          APPLE_CERTIFICATE_PASSWORD: ${{ inputs.signed && secrets.APPLE_CERTIFICATE_PASSWORD || '' }}
        with:
          tauriScript: pnpm tauri
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }} --config src-tauri/tauri.release.generated.json
      - name: Verify macOS distribution signature
        if: runner.os == 'macOS' && inputs.signed
        shell: bash
        run: |
          codesign --verify --deep --strict --verbose=2 src-tauri/target/${{ matrix.target }}/release/bundle/macos/MoviBox.app
          xcrun stapler validate src-tauri/target/${{ matrix.target }}/release/bundle/macos/MoviBox.app
          spctl --assess --type execute --verbose=2 src-tauri/target/${{ matrix.target }}/release/bundle/macos/MoviBox.app
      - name: Upload installers and detached signatures
        uses: actions/upload-artifact@v7
        with:
          name: movibox-${{ matrix.platform }}-${{ inputs.signed && 'signed' || 'local' }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.app.tar.gz*
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.AppImage*
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*.exe*
          if-no-files-found: error
          retention-days: 14
