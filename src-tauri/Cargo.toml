[package]
name = "movibox"
version = "0.9.22"
description = "A Stremio-powered automatic movie and series downloader"
edition = "2021"

[lib]
name = "movibox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-http = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-window-state = "2"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io", "rt"] }
axum = { version = "0.8", features = ["ws"] }
reqwest = { version = "0.12", default-features = false, features = [
  "native-tls",
  "stream",
  "multipart",
  "json",
  "gzip",
  "hickory-dns",
] }
uuid = { version = "1", features = ["v4"] }
futures-util = "0.3"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
  "logging",
] }
harbor-core = { path = "../harbor-core" }
librqbit = { version = "=8.1.1", default-features = false, features = ["rust-tls"] }
url = "2"
hickory-resolver = "0.25"
rusqlite = { version = "0.37", features = ["bundled"] }
chrono = "0.4"
chrono-tz = "0.10"
croner = "3.0.1"
keyring = { version = "3.6.3", features = [
  "apple-native",
  "windows-native",
  "sync-secret-service",
  "crypto-rust",
] }
fs2 = "0.4"
regex = "1"
roxmltree = "0.21"
sha2 = "0.10"
tempfile = "3"
tauri-plugin-updater = "2"
trash = "5.2.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_SystemInformation",
  "Win32_System_LibraryLoader",
] }
window-vibrancy = "0.6"
wasapi = "0.15"
webview2-com = "0.38"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = { version = "0.18", features = ["v3_24"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[profile.dev]
debug = "line-tables-only"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSApplication",
  "NSMenu",
  "NSMenuItem",
  "NSImage",
] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
